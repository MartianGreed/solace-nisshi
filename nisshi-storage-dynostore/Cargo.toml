[package]
name = "nisshi-storage-dynostore"
description = "Nisshi storage backend for memory://, s3:// and gs:// via ObjectStore"
edition.workspace = true
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
authors.workspace = true
include.workspace = true

[features]
test-support = []

[dependencies]
async-trait.workspace = true
bytes.workspace = true
cached.workspace = true
dotenv.workspace = true
futures.workspace = true
governor.workspace = true
human-units.workspace = true
nisshi-sans-io.workspace = true
nisshi-schema.workspace = true
nisshi-storage = {workspace = true, features = ["dynostore"]}
object_store.workspace = true
opentelemetry-semantic-conventions.workspace = true
opentelemetry.workspace = true
percent-encoding.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
rama.workspace = true
temp-env = { workspace = true, features = ["async_closure"] }
tokio-util.workspace = true
tracing-subscriber.workspace = true


[lints]
workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
object_store = { workspace = true, features = ["default", "aws", "gcp"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
rama = { workspace = true, features = ["default", "http", "tcp"] }
tokio-util = { workspace = true, features = ["full"] }
